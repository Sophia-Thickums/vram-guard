[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vram-guard"
version = "0.1.0"
description = "Stand down when the GPU is busy, so a helper agent never steals VRAM from a game."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sophia Marie DeClue"}]

[project.urls]
Homepage = "https://github.com/Sophia-Thickums/vram-guard"

[tool.setuptools]
py-modules = ["vram_guard"]
